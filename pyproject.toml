[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voice-gateway"
version = "0.1.1"
description = "Local physical voice gateway with offline wake-word, voiceprint recognition, FunASR STT and MOSS-TTS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DeepSeek Harness Community" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "PyAudio>=0.2.14",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "onnxruntime>=1.18.0",
    "onnx>=1.16.0",
    "onnxscript>=0.1.0",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "transformers>=4.40.0,<4.48.0",
    "sentencepiece>=0.1.99",
    "funasr>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
local-voice-gateway = "main:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
