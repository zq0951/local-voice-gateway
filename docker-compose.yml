services:
  # ==============================================================================
  # 本地语音交互网关 (Local Voice Gateway - 纯本地全集成单容器)
  # 内置唤醒词、CAM++ 声纹、FunASR SenseVoice 纯本地推理与 MOSS-TTS 语音合成
  # ==============================================================================
  voice-gateway:
    build: .
    image: local-voice-gateway:latest
    container_name: lvg_voice_gateway
    restart: unless-stopped
    privileged: true
    ipc: host
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - .:/app
      - /etc/asound.conf:/etc/asound.conf:ro
      - ${MOSS_MODEL_DIR:-./models/moss_tts}:/app/models/moss_tts
      - ${FUNASR_MODEL_DIR:-./models/funasr}:/app/models/funasr
      - ./models/voice_profiles:/app/models/voice_profiles
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=${GATEWAY_PORT:-8765}
      - TRIGGER_MODE=${TRIGGER_MODE:-hybrid}
      - AUDIO_DUPLEX_MODE=${AUDIO_DUPLEX_MODE:-half}
      - AUTO_SPEAK=${AUTO_SPEAK:-true}
      - WAKE_WORD_MODEL=${WAKE_WORD_MODEL:-hey_jarvis}
      - VOICEPRINT_THRESHOLD=${VOICEPRINT_THRESHOLD:-0.50}
    network_mode: "host"
