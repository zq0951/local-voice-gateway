services:
  # ==============================================================================
  # 本地语音交互网关 (Local Voice Gateway - 纯本地全集成单容器)
  # 内置唤醒词、CAM++ 声纹、FunASR SenseVoice 纯本地推理与 MOSS-TTS 语音合成
  # ==============================================================================
  voice-gateway:
    build: .
    image: local-voice-gateway:latest
    container_name: lvg_voice_gateway
    restart: unless-stopped
    privileged: true
    ipc: host
    devices:
      - "/dev/snd:/dev/snd"
    volumes:
      - .:/app
      - /etc/asound.conf:/etc/asound.conf:ro
      - /root/smarthome/MOSS-TTS-Nano:/root/smarthome/MOSS-TTS-Nano
      - /root/smarthome/voice-stack/funasr-models:/root/smarthome/voice-stack/funasr-models
      - ./models/voice_profiles:/app/models/voice_profiles
    environment:
      - TRIGGER_MODE=hybrid
      - AUDIO_DUPLEX_MODE=half
      - AUTO_SPEAK=true
      - GATEWAY_PORT=8765
      - WAKE_WORD_MODEL=hey_jarvis
      - VOICEPRINT_THRESHOLD=0.40
    network_mode: "host"
